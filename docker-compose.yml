services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HEALTHNEXUS_STORAGE: local
    volumes:
      - ./data/generated:/workspace/data/generated:ro
      - ./artifacts/models:/workspace/artifacts/models:ro
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
