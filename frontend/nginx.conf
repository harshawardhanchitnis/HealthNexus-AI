server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_read_timeout 300s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /runtime-config.js { add_header Cache-Control "no-store"; }
    location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.mjs$ { default_type application/javascript; try_files $uri =404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
